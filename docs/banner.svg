<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">Leonardo Nucamendi Ruiz — Portafolio y blog técnico</title>
  <desc id="desc">Banner oscuro con estética de terminal, detalles en verde y una tarjeta de proyectos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050807"/>
      <stop offset="0.55" stop-color="#07110d"/>
      <stop offset="1" stop-color="#0b1110"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3df0a8"/>
      <stop offset="1" stop-color="#3de4ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#18221f" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)" opacity="0.55"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#1f3a30"/>

  <rect x="0" y="0" width="7" height="320" rx="3.5" fill="url(#line)"/>
  <circle cx="1120" cy="40" r="110" fill="#3df0a8" opacity="0.045"/>
  <circle cx="1040" cy="270" r="150" fill="#3de4ff" opacity="0.035"/>

  <text x="64" y="70" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="16" letter-spacing="4" fill="#3df0a8">// PORTAFOLIO + BLOG</text>
  <text x="64" y="148" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="62" font-weight="700" fill="#eef5f1" filter="url(#glow)">Leonardo<tspan fill="#3df0a8">.</tspan></text>
  <text x="66" y="190" font-family="'Manrope','Segoe UI',sans-serif" font-size="22" fill="#8c9c95">Nucamendi Ruiz <tspan fill="#3df0a8">·</tspan> Portafolio y notas de ingeniería</text>
  <text x="66" y="226" font-family="'JetBrains Mono',Consolas,monospace" font-size="14" fill="#58675f">HTML · CSS · JavaScript · FastAPI · MongoDB · Render · Vercel</text>

  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="12">
    <rect x="66" y="260" width="92" height="28" rx="6" fill="#0b1a14" stroke="#1f7a56"/>
    <text x="112" y="279" text-anchor="middle" fill="#3df0a8">LANDING</text>
    <rect x="168" y="260" width="112" height="28" rx="6" fill="#0b1a14" stroke="#1f7a56"/>
    <text x="224" y="279" text-anchor="middle" fill="#3df0a8">BLOG</text>
    <rect x="290" y="260" width="132" height="28" rx="6" fill="#0b1a14" stroke="#1f7a56"/>
    <text x="356" y="279" text-anchor="middle" fill="#3df0a8">CMS API</text>
  </g>

  <g>
    <rect x="720" y="44" width="416" height="232" rx="14" fill="#07100c" stroke="#24352f"/>
    <rect x="720" y="44" width="416" height="38" rx="14" fill="#0b1110"/>
    <rect x="720" y="68" width="416" height="14" fill="#0b1110"/>
    <circle cx="744" cy="63" r="5" fill="#ff5d5d"/>
    <circle cx="762" cy="63" r="5" fill="#ffd23f"/>
    <circle cx="780" cy="63" r="5" fill="#3df0a8"/>
    <text x="804" y="68" font-family="'JetBrains Mono',Consolas,monospace" font-size="11" fill="#58675f">portfolio — production</text>

    <g font-family="'JetBrains Mono',Consolas,monospace" font-size="13">
      <text x="744" y="112" fill="#58675f">$</text>
      <text x="762" y="112" fill="#dbe7e1">whoami</text>
      <text x="744" y="138" fill="#3df0a8">✓ ing. en TI · México</text>

      <text x="744" y="170" fill="#58675f">$</text>
      <text x="762" y="170" fill="#dbe7e1">ls proyectos/</text>
      <text x="744" y="196" fill="#3de4ff">✓ lawpocket · math-quest</text>

      <text x="744" y="228" fill="#58675f">$</text>
      <text x="762" y="228" fill="#dbe7e1">open blog</text>
      <text x="744" y="254" fill="#b48cff">✓ notas · cms · métricas</text>
    </g>
  </g>
</svg>
